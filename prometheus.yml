"""Prometheus configuration generator.

This file should be placed at: prometheus.yml
"""

global:
  scrape_interval: 15s        # How often to scrape targets by default
  evaluation_interval: 15s    # How often to evaluate rules
  external_labels:
    environment: 'production'
    service: 'codelens-rag-agent'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - 'alert-rules.yml'

# Scrape configurations
scrape_configs:
  
  # =========================================================================
  # Prometheus Self-Monitoring
  # =========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # =========================================================================
  # FastAPI Backend Application Metrics
  # =========================================================================
  - job_name: 'codelens-backend'
    scrape_interval: 5s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'codelens-rag-agent'
          component: 'fastapi'
      - target_label: __address__
        replacement: localhost:9090

  # =========================================================================
  # Jaeger Metrics
  # =========================================================================
  - job_name: 'jaeger'
    scrape_interval: 10s
    static_configs:
      - targets: ['jaeger:14269']
        labels:
          service: 'jaeger'
          component: 'tracing'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'jaeger_.*'
        action: keep

  # =========================================================================
  # PostgreSQL (via postgres_exporter - optional)
  # =========================================================================
  # Uncomment if postgres_exporter is deployed
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         database: 'codelens_ai'
  #         service: 'postgresql'

  # =========================================================================
  # Redis (via redis_exporter - optional)
  # =========================================================================
  # Uncomment if redis_exporter is deployed
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'
