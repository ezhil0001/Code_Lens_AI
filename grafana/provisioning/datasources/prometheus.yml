# Grafana datasources provisioning configuration
# Place this at: grafana/provisioning/datasources/prometheus.yml

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceID":"(\w+)"'
          url: 'http://jaeger:16686/trace/$1'
          datasourceUid: jaeger
    version: 1

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    version: 1

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    version: 1
