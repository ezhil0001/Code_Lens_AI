"""Grafana dashboard provisioning configuration.

Place this at: grafana/provisioning/dashboards/dashboards.yml
"""

apiVersion: 1

providers:
  - name: CodeLens Dashboards
    orgId: 1
    folder: CodeLens
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
