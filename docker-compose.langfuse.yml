# ===============================================================================
# Langfuse Self-Hosted — LLM Observability & Evaluation Platform
# ===============================================================================
#
# Primary observability platform for CodeLens_AI. Captures full LLM trace
# hierarchies (request → agent routing → retrieval → rerank → generation),
# token usage, cost, latency, prompts/completions, errors, and evaluation
# scores (faithfulness / context recall / answer relevancy).
#
# Langfuse v3 architecture:
#   langfuse-web      — UI + ingestion API (port 3000)
#   langfuse-worker   — async trace/event processor
#   postgres          — transactional store (projects, users, scores, config)
#   clickhouse        — high-volume analytical store (traces, observations)
#   redis             — queue + cache between web and worker
#   minio             — S3-compatible blob store (large payloads, media, exports)
#
# Quick start:
#   1. cp .env.langfuse.example .env.langfuse   (then edit secrets)
#   2. docker compose -f docker-compose.langfuse.yml --env-file .env.langfuse up -d
#   3. Open http://localhost:3000  → create org/project → copy API keys
#   4. Put the keys in backend/.env  (LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY)
#
# Tear down (keep data):   docker compose -f docker-compose.langfuse.yml down
# Tear down (wipe data):   docker compose -f docker-compose.langfuse.yml down -v
# ===============================================================================

services:

  # ---------------------------------------------------------------------------
  # Langfuse Web — UI + ingestion API
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: codelens_langfuse_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${LANGFUSE_WEB_PORT:-3000}:3000"
    environment:
      # Docker injects HOSTNAME=<container id>, and the Next.js standalone
      # server binds to whatever HOSTNAME resolves to — the container IP, not
      # 0.0.0.0. The container's own healthcheck then gets ECONNREFUSED on
      # localhost:3000 and the service is permanently "unhealthy" even though
      # the API works. Bind all interfaces instead.
      HOSTNAME: "0.0.0.0"
      # ---- Core / Postgres ----
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY - 64 hex chars}
      # ---- ClickHouse ----
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # ---- Redis ----
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:-langfuse_redis}@redis:6379/0
      # ---- S3 / MinIO (event uploads + media) ----
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      # ---- Behaviour ----
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-true}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      AUTH_DISABLE_SIGNUP: ${LANGFUSE_AUTH_DISABLE_SIGNUP:-false}
      # ---- Headless init (org / project / user / API keys on first boot) ----
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to ::1 first
      # and the Next.js server listens on IPv4 only, so the probe would get
      # ECONNREFUSED and mark a perfectly healthy service as unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - langfuse_network

  # ---------------------------------------------------------------------------
  # Langfuse Worker — async trace/event ingestion processor
  # ---------------------------------------------------------------------------
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: codelens_langfuse_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY - 64 hex chars}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:-langfuse_redis}@redis:6379/0
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    networks:
      - langfuse_network

  # ---------------------------------------------------------------------------
  # PostgreSQL — Langfuse transactional metadata store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: codelens_langfuse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - langfuse_network

  # ---------------------------------------------------------------------------
  # ClickHouse — Langfuse high-volume trace/observation store
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: codelens_langfuse_clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - langfuse_network

  # ---------------------------------------------------------------------------
  # Redis — Langfuse queue + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: codelens_langfuse_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${LANGFUSE_REDIS_PASSWORD:-langfuse_redis}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-langfuse_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - langfuse_network

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible blob store for large payloads / media / exports
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: codelens_langfuse_minio
    restart: unless-stopped
    entrypoint: sh
    # Create the bucket on first boot, then start the server.
    command: -c 'mkdir -p /data/${LANGFUSE_S3_BUCKET:-langfuse} && minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    ports:
      - "${MINIO_API_PORT:-9090}:9000"
      - "${MINIO_CONSOLE_PORT:-9091}:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - langfuse_network

networks:
  langfuse_network:
    driver: bridge
    name: codelens_langfuse_network

volumes:
  langfuse_postgres_data:
    name: codelens_langfuse_postgres_data
  langfuse_clickhouse_data:
    name: codelens_langfuse_clickhouse_data
  langfuse_clickhouse_logs:
    name: codelens_langfuse_clickhouse_logs
  langfuse_redis_data:
    name: codelens_langfuse_redis_data
  langfuse_minio_data:
    name: codelens_langfuse_minio_data
