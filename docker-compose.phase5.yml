version: '3.9'

# ===============================================================================
# Phase 5: Complete Open-Source Observability & Evaluation Stack
# ===============================================================================
# 
# Services:
# 1. FastAPI Backend (Port 8000)
# 2. PostgreSQL with pgvector (Port 5432)
# 3. ChromaDB Vector Store (Port 8001)
# 4. Ollama (Local LLM) (Port 11434)
# 5. Jaeger (Distributed Tracing) (Port 6831, 16686)
# 6. Prometheus (Metrics Collection) (Port 9090)
# 7. Grafana (Visualization) (Port 3000)
# 8. Redis (Optional Caching) (Port 6379)
#
# Observability Stack Flow:
# FastAPI → Jaeger (traces) + Prometheus (metrics) ← Grafana (visualization)
#
# To start:
#   docker-compose up -d
#
# To stop:
#   docker-compose down -v
#
# Monitoring URLs:
#   - Jaeger UI: http://localhost:16686
#   - Prometheus: http://localhost:9090
#   - Grafana: http://localhost:3000
#   - FastAPI Docs: http://localhost:8000/docs
# ===============================================================================

services:
  
  # =========================================================================
  # 1. PostgreSQL + pgvector (Database with Vector Extension)
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codelens_postgres
    environment:
      POSTGRES_DB: codelens_ai
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: codelens_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codelens_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 2. ChromaDB (Vector Store for Embeddings)
  # =========================================================================
  chroma:
    image: chromadb/chroma:latest
    container_name: codelens_chroma
    environment:
      ALLOW_RESET: "true"
      CHROMA_HOST: "0.0.0.0"
      CHROMA_PORT: "8001"
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/chroma/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codelens_network
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 3. Ollama (Local LLM for Evaluation & Inference)
  # =========================================================================
  # Note: Ollama requires GPU support. For CPU-only, consider:
  #   - Remove 'deploy.resources.reservations.devices'
  #   - Use CPU-optimized model (e.g., mistral:7b-instruct-q4_0)
  ollama:
    image: ollama/ollama:latest
    container_name: codelens_ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "5m"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/pull-models.sh:/docker-entrypoint.d/pull-models.sh:ro
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - codelens_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # =========================================================================
  # 4. Redis (Optional Caching & Session Store)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: codelens_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelens_network
    command: redis-server --appendonly yes --requirepass redis_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 5. Jaeger (Distributed Tracing Backend)
  # =========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: codelens_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_HTTP_HOST_PORT: ":4318"
      COLLECTOR_OTLP_GRPC_HOST_PORT: ":4317"
    ports:
      # Jaeger UI
      - "16686:16686"
      # Jaeger receiver ports
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "6831:6831/udp"  # Jaeger Thrift UDP
      - "14268:14268"  # Jaeger Thrift HTTP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codelens_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 6. Prometheus (Metrics Collection & Time-Series Database)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: codelens_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelens_network
    depends_on:
      - jaeger
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 7. Grafana (Visualization & Dashboarding)
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: codelens_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelens_network
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 8. FastAPI Backend (Phase 5 Integrated)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: codelens_backend
    environment:
      # Database
      DATABASE_URL: "postgresql://codelens:codelens_password@postgres:5432/codelens_ai"
      
      # Redis
      REDIS_URL: "redis://:redis_password@redis:6379/0"
      
      # ChromaDB
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8001"
      
      # OpenTelemetry Configuration
      SERVICE_NAME: "codelens-rag-agent"
      SERVICE_VERSION: "5.0.0"
      ENVIRONMENT: "production"
      
      # Jaeger Configuration
      JAEGER_HOST: "jaeger"
      JAEGER_PORT: "6831"
      JAEGER_GRPC_PORT: "4317"
      JAEGER_HTTP_PORT: "14268"
      TRACE_SAMPLE_RATE: "1.0"
      
      # Prometheus
      PROMETHEUS_PORT: "8888"
      
      # Ollama LLM
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "mistral"
      
      # Application Settings
      LOG_LEVEL: "INFO"
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:4200", "http://frontend:4200"]'
      API_TITLE: "CodeLens RAG Agent"
      API_VERSION: "5.0.0"
      
      # LLM Configuration
      LLM_MODEL: "meta-llama/Llama-3.1-70b-instruct"
      LLM_TEMPERATURE: "0.7"
      LLM_MAX_TOKENS: "2048"
    
    ports:
      - "8000:8000"
      - "8888:8888"  # Prometheus metrics
    volumes:
      - ./backend:/app/backend
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codelens_network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app 
          --host 0.0.0.0 
          --port 8000 
          --reload 
          --log-level info
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # =========================================================================
  # 9. Frontend (Angular App)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codelens_frontend
    environment:
      API_URL: "http://backend:8000"
      JAEGER_ENABLED: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - codelens_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 10. Optional: pgAdmin (PostgreSQL Management UI)
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codelens_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@codelens.local"
      PGADMIN_DEFAULT_PASSWORD: "admin123"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - codelens_network
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ===============================================================================
# VOLUMES
# ===============================================================================

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local
  backend_logs:
    driver: local

# ===============================================================================
# NETWORKS
# ===============================================================================

networks:
  codelens_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
